# A persistent local H2 database lets the application start without MySQL.
# Set MYSQL_URL, MYSQL_USERNAME, and MYSQL_PASSWORD to use MySQL in production.
server.port=${PORT:8080}

spring.datasource.url=${MYSQL_URL:jdbc:h2:file:./data/noteflow;MODE=MySQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${MYSQL_USERNAME:sa}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
